# Rebuilds js/data.js with the latest games and commits it if anything changed.
# Runs Tuesday and Friday mornings (US time) and can be started by hand from the Actions tab.
# Delete this file if you would rather refresh the data yourself.
name: Update data
on:
  schedule:
    - cron: "0 11 * * 2"
    - cron: "0 11 * * 5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_data.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- js/data.js; then
            echo "No new games."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/data.js
            git commit -m "Refresh data"
            git push
          fi
